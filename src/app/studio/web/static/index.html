<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Audiobook Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233559d6'/%3E%3Cpath d='M9 20v-4a7 7 0 0 1 14 0v4' stroke='white' stroke-width='2.4' fill='none'/%3E%3Crect x='7' y='18' width='5' height='8' rx='2' fill='white'/%3E%3Crect x='20' y='18' width='5' height='8' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="shell">
    <header class="topbar">
      <button class="nav-toggle btn ghost" type="button" aria-controls="sidenav" aria-expanded="false" id="nav-toggle">
        <span aria-hidden="true">☰</span><span class="sr-only">Menu</span></button>
      <a class="brand" href="#/overview" aria-label="Audiobook Studio home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" class="brand-bg"/><path d="M9 20v-4a7 7 0 0 1 14 0v4" stroke="#fff" stroke-width="2.4" fill="none"/><rect x="7" y="18" width="5" height="8" rx="2" fill="#fff"/><rect x="20" y="18" width="5" height="8" rx="2" fill="#fff"/></svg>
        <span>Audiobook Studio</span></a>
      <div class="topbar-status" id="worker-pill" role="status" aria-live="polite"><span class="dot"></span><span class="label">Connecting…</span></div>
      <span class="engine-badge" id="engine-badge" hidden></span>
      <div class="user-box" id="user-box" hidden><span class="uname"></span>
        <button class="btn small ghost" type="button" id="chpw">Password</button>
        <button class="btn small ghost" type="button" id="signout">Sign out</button></div>
    </header>
    <nav class="sidenav" id="sidenav" aria-label="Main">
      <ul>
        <li><a href="#/overview" data-nav="overview"><span aria-hidden="true">◎</span> Overview</a></li>
        <li><a href="#/library" data-nav="library"><span aria-hidden="true">▤</span> Library &amp; Import</a></li>
        <li><a href="#/queue" data-nav="queue"><span aria-hidden="true">≡</span> Queue</a></li>
        <li><a href="#/voices" data-nav="voices"><span aria-hidden="true">♪</span> Narrator Studio</a></li>
        <li><a href="#/review" data-nav="review"><span aria-hidden="true">✓</span> Review &amp; QA</a></li>
        <li><a href="#/settings" data-nav="settings"><span aria-hidden="true">⚙</span> Settings &amp; Storage</a></li>
        <li><a href="#/about" data-nav="about"><span aria-hidden="true">ⓘ</span> About &amp; System</a></li>
      </ul>
      <p class="nav-foot"><a href="#/about" id="ver" class="ver-link">Audiobook Studio</a><br>TSAL Solutions LLC<br>Private network only<br>No uploads to third parties</p>
    </nav>
    <main id="main" tabindex="-1">
      <div class="banner" id="conn-banner" role="status" hidden></div>
      <div id="view"><p class="muted">Loading…</p></div>
    </main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Audiobook Studio needs JavaScript enabled.</p></noscript>
</body>
</html>
